#!/usr/sbin/nft -f

table inet filter
table inet nat
flush table inet filter
flush table inet nat

define internet = { "__DEFAULT_INTERFACE__" }
define docker = { "docker0", "br-*" }
define loopback = { "lo" }
define wireguard = { "wg*" }

table inet filter {

    chain external_filter {
        ip protocol icmp accept
        
        tcp dport 22 accept # ssh
        tcp dport 80 accept # http
        tcp dport 443 accept # https
        udp dport 443 accept # quic
    }

    chain internal_filter {
        ip protocol icmp accept
    
        # allow internet to any (filtering in prerouting)
        iifname $internet accept

        # allow docker to any
        iifname $docker accept

        # allow any to docker
        oifname $docker accept
    }

    chain prerouting {
        type filter hook prerouting priority -150; policy drop;
        ct state established,related accept

		iifname $docker accept
		iifname $loopback accept
		iifname $wireguard accept

        iifname $internet jump external_filter
        iifname $internet drop
    }


    chain input {
            type filter hook input priority 0; policy drop;
            ct state established,related accept
			iifname "lo" accept
			jump internal_filter
    }

    chain forward {
            type filter hook forward priority 0; policy drop;
            ct state established,related accept
            jump internal_filter
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }

    chain postrouting {
    	type filter hook postrouting priority 150; policy accept;
    }
}

table inet nat {
    chain prerouting {
        type nat hook prerouting priority -100; policy accept;
    }

    chain postrouting {
        type nat hook postrouting priority 100; policy accept;

        oifname $internet masquerade
    }
}